name: Update Nix sources

on:
  # A v* tag push is the real release signal. The `release: [published]`
  # event never fires for releases created by CI: tauri-action publishes
  # them with the repository GITHUB_TOKEN, and GitHub does not dispatch
  # workflow events for GITHUB_TOKEN actions (only workflow_dispatch /
  # repository_dispatch re-fire). release.yml triggers the same way, so the
  # nix source update runs in lockstep with the build.
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.2)"
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # A v* tag push always runs; prerelease tags (v1.2.3-rc.1) are caught by
    # the Normalize tag step's skip detection below. The release-event clause
    # stays as a safety net for releases created outside CI (e.g. with a PAT),
    # where GitHub does fire release: [published] — skip those when prerelease.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease

    steps:
      # A tag push or release event leaves the default checkout on the tag
      # (detached HEAD); create-pull-request needs a branch base, so always
      # check out main.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Normalize tag
        id: tag
        env:
          RAW_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
        run: |
          case "$RAW_TAG" in
            v*) TAG="$RAW_TAG" ;;
            *) TAG="v$RAW_TAG" ;;
          esac
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Only clean stable tags (vX.Y.Z) update nix sources. Prerelease,
          # build-branch, and malformed tags produce asset names that never
          # exist; skip them with a clear message instead of timing out the
          # download poll below.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for and download release assets
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "DevSlides_${VERSION}_amd64.deb"
            "DevSlides_x64.app.tar.gz"
            "DevSlides_aarch64.app.tar.gz"
          )

          asset_names() {
            gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" \
              --json assets --jq '.assets[].name' 2>/dev/null || true
          }

          # `release: [published]` fires the moment tauri-action creates the
          # release, which can be minutes before its macOS legs finish uploading
          # their tarballs. Poll the assets API (a cheap call) until every
          # expected name exists, then download each exactly once — the macOS
          # legs routinely lag 15+ minutes, so re-downloading the already-fixed
          # deb every iteration would waste hundreds of MB of egress.
          deadline=$((SECONDS + 1800))
          names=""
          while (( SECONDS < deadline )); do
            names=$(asset_names)
            missing=0
            for f in "${expected[@]}"; do
              if ! grep -qxF "$f" <<<"$names"; then
                echo "waiting for $f..."
                missing=1
              fi
            done
            (( missing == 0 )) && break
            sleep 10
          done
          for f in "${expected[@]}"; do
            grep -qxF "$f" <<<"$names" \
              || { echo "release asset still missing: $f" >&2; exit 1; }
          done

          # Download into a fresh temp dir, then verify each file's byte count
          # against the size the API reports. gh writes straight to the final
          # filename with no atomic rename, so a transfer cut mid-body would
          # otherwise leave a truncated file that `test -s` accepts — and a
          # wrong SRI hash would be committed to nix/sources.json.
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          for attempt in 1 2 3; do
            gh release download "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "DevSlides_${VERSION}_amd64.deb" \
              --pattern "DevSlides_x64.app.tar.gz" \
              --pattern "DevSlides_aarch64.app.tar.gz" \
              --dir "$tmpdir" || true

            ok=1
            for f in "${expected[@]}"; do
              want=$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" \
                --json assets --jq ".assets[] | select(.name == \"$f\") | .size" 2>/dev/null)
              # wc right-pads its output (e.g. "     100"), so strip whitespace
              # before comparing; a missing file yields 0.
              have=$(wc -c < "$tmpdir/$f" 2>/dev/null | tr -d '[:space:]')
              have=${have:-0}
              if [[ "$have" != "$want" ]]; then
                echo "size mismatch for $f (have=$have want=$want); retrying" >&2
                ok=0
                break
              fi
            done
            (( ok == 1 )) && break
            # Next attempt re-downloads over the same names (gh clobbers), so a
            # truncated file from a failed attempt is simply replaced.
          done

          for f in "${expected[@]}"; do
            want=$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" \
              --json assets --jq ".assets[] | select(.name == \"$f\") | .size" 2>/dev/null)
            have=$(wc -c < "$tmpdir/$f" 2>/dev/null | tr -d '[:space:]')
            have=${have:-0}
            test "$have" = "$want" \
              || { echo "asset $f failed size verification after retries" >&2; exit 1; }
          done

          mv "$tmpdir"/* .
          echo "All release assets downloaded and verified"
          ls -la "${expected[@]}"

      - name: Compute SRI hashes
        if: steps.tag.outputs.skip != 'true'
        id: hashes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          hash_sri() {
            openssl dgst -sha256 -binary "$1" | base64 | tr -d '\n'
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "linux=sha256-$(hash_sri "DevSlides_${VERSION}_amd64.deb")" >> "$GITHUB_OUTPUT"
          echo "x64-darwin=sha256-$(hash_sri "DevSlides_x64.app.tar.gz")" >> "$GITHUB_OUTPUT"
          echo "aarch64-darwin=sha256-$(hash_sri "DevSlides_aarch64.app.tar.gz")" >> "$GITHUB_OUTPUT"

      - name: Update nix/sources.json
        if: steps.tag.outputs.skip != 'true'
        run: |
          cat > nix/sources.json <<- EOF
          {
            "version": "${{ steps.hashes.outputs.version }}",
            "hashes": {
              "x86_64-linux": "${{ steps.hashes.outputs.linux }}",
              "x86_64-darwin": "${{ steps.hashes.outputs.x64-darwin }}",
              "aarch64-darwin": "${{ steps.hashes.outputs.aarch64-darwin }}"
            }
          }
          EOF

      - name: Create PR
        if: steps.tag.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update nix sources to ${{ steps.hashes.outputs.version }}"
          title: "nix: update sources to ${{ steps.hashes.outputs.version }}"
          body: "Automated update of `nix/sources.json` for release ${{ steps.tag.outputs.tag }}."
          base: main
          # Only commit the manifest; the downloaded release assets sit in the
          # work tree and must not be committed.
          add-paths: nix/sources.json
          branch: update-nix-sources/${{ steps.hashes.outputs.version }}
          delete-branch: true
