name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "build/**"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publish as a prerelease"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  extract-notes:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
      payloadJson: ${{ steps.notes.outputs.payloadJson }}
      isPrerelease: ${{ steps.meta.outputs.isPrerelease }}
      releaseTag: ${{ steps.meta.outputs.releaseTag }}
      releaseName: ${{ steps.meta.outputs.releaseName }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VER=$(node -p "require('./package.json').version")
            echo "version=v${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes
        id: notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bun scripts/extract-release-note.mjs

      - name: Release metadata
        id: meta
        shell: bash
        env:
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          # Centralized prerelease decision, per semver. A v-tag is a
          # prerelease only when it carries a prerelease suffix (v1.2.3-rc.1);
          # clean vX.Y.Z tags, with or without +build metadata, are stable.
          # Anything unclassifiable fails loudly rather than guess — a
          # misclassified tag would silently skip the marketing-site update or
          # publish a stable release as a prerelease.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z] ]]; then
              is_prerelease=true
            elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$ ]]; then
              is_prerelease=false
            else
              echo "::error::Cannot classify release tag ${GITHUB_REF_NAME} (expected vX.Y.Z or vX.Y.Z-<prerelease>)" >&2
              exit 1
            fi
            echo "isPrerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"
            echo "releaseTag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "releaseName=OpenSlides ${VERSION}" >> "$GITHUB_OUTPUT"
          else
            # Branch / manual builds never create a v* tag.
            if [[ "${INPUT_PRERELEASE}" == "false" ]]; then
              echo "isPrerelease=false" >> "$GITHUB_OUTPUT"
            else
              echo "isPrerelease=true" >> "$GITHUB_OUTPUT"
            fi
            echo "releaseTag=build-${VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "releaseName=OpenSlides ${VERSION} (build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
          fi

  build-tauri:
    needs: extract-notes
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS Apple Silicon ──
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin

          # ── macOS Intel ──
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin

          # ── Windows x64 ──
          - platform: windows-latest
            args: ""
            rust_targets: ""

          # ── Windows ARM64 ──
          - platform: windows-latest
            args: --target aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc

          # ── Linux x86_64 (deb, rpm, AppImage) ──
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust_targets }}-${{ matrix.args }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build, bundle, and attach release artifacts
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.extract-notes.outputs.releaseTag }}
          releaseName: ${{ needs.extract-notes.outputs.releaseName }}
          releaseBody: ${{ fromJSON(needs.extract-notes.outputs.payloadJson).fullNotes }}
          releaseDraft: false
          prerelease: ${{ needs.extract-notes.outputs.isPrerelease }}
          args: ${{ matrix.args }}
          tauriScript: bun run tauri

      # Strip the bundled libwayland-* libs from the AppImage so it loads the
      # host copies at runtime. Ubuntu 22.04 ships older libwayland than recent
      # Mesa needs; AppImage puts bundled libs first on the search path, so the
      # stale copy wins and EGL can fail. Removing them redirects resolution to
      # the host copy present on every GTK-capable system.
      - name: Fix AppImage wayland libs
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.extract-notes.outputs.releaseTag }}
        run: |
          set -euo pipefail

          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          echo "Patching: $APPIMAGE"

          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null

          for lib in libwayland-client.so.0 libwayland-egl.so.1 libwayland-cursor.so.0; do
            if [ -e "squashfs-root/usr/lib/$lib" ]; then
              rm -f "squashfs-root/usr/lib/$lib"
            fi
          done
          rm -f squashfs-root/usr/lib/libwayland-server.so.0 || true

          # The ~93MB appimagetool download and the final upload are the two
          # network-critical steps in this leg. tauri-action already published
          # the release before this step runs, so a transient network blip here
          # would fail the whole linux run for no good reason — give each a
          # retry window. Retry only transient failures (timeouts, connection
          # refused, 5xx), not permanent 404s; cap each attempt so a stalled
          # transfer can't hang the step; and resume on retry instead of
          # restarting the download from byte 0.
          curl -fL --retry 5 --retry-connrefused --retry-delay 5 \
            --connect-timeout 30 --max-time 600 -C - \
            -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"

          rm -rf squashfs-root
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/openslides \
            || test -x squashfs-root/usr/bin/OpenSlides \
            || { echo "openslides binary missing from repacked AppImage"; ls -la squashfs-root/usr/bin/ || true; exit 1; }
          popd >/dev/null

          # Keep the unpatched copy so a failed --clobber replace can be rolled
          # back: gh deletes the existing asset BEFORE uploading the
          # replacement, so a failed attempt would otherwise leave the published
          # release with no AppImage at all.
          cp "$APPIMAGE" "$WORK/original.AppImage"
          cp "$WORK/$BASENAME" "$APPIMAGE"

          uploaded=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "$APPIMAGE" \
                --clobber --repo "$GITHUB_REPOSITORY"; then
              echo "Uploaded patched $BASENAME (attempt $attempt)"
              uploaded=1
              break
            fi
            echo "gh release upload attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          if (( uploaded != 1 )); then
            echo "Failed to upload patched $BASENAME after 5 attempts" >&2
            echo "Restoring original $BASENAME to the release" >&2
            gh release upload "$RELEASE_TAG" "$WORK/original.AppImage#$BASENAME" \
              --clobber --repo "$GITHUB_REPOSITORY" \
              || echo "::warning::Could not restore original $BASENAME to the release" >&2
            exit 1
          fi

  update-marketing-site:
    needs: [extract-notes, build-tauri]
    # Stable tags only — a prerelease tag (e.g. v1.2.3-rc.1) must not push
    # release notes to the marketing site. String comparison (not fromJSON):
    # fromJSON('') throws and GitHub silently treats a throwing `if` as false,
    # which would skip the update with no signal. Every v-tag path above always
    # sets isPrerelease, so this can only skip on a genuine prerelease.
    if: startsWith(github.ref, 'refs/tags/v') && needs.extract-notes.outputs.isPrerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Send release notes to the marketing site
        uses: actions/github-script@v7
        env:
          PAYLOAD: ${{ needs.extract-notes.outputs.payloadJson }}
        with:
          github-token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'codewiththiha',
              repo: 'OpenSlidesWebsite',
              event_type: 'update_release_notes',
              client_payload: JSON.parse(process.env.PAYLOAD),
            })
