[package]
name = "devslides"
version = "1.4.1"
description = "DevSlides — offline-first code presentation desktop app (a fork of OpenSlides)"
authors = ["codewiththiha", "alyohara"]
edition = "2024"

[lib]
name = "devslides_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Runtime-only sqlx — no `macros` feature.
# The macros proc-macro dylib can corrupt on macOS release builds
# ("mis-aligned LINKEDIT string pool"). We only use sqlx::query / query_as.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
once_cell = "1"
aho-corasick = "1"
arboard = "3"
base64 = "0.22"
png = "0.18"
ureq = "2"

[profile.dev]
incremental = true

[profile.release]
opt-level = "z"   # Optimize strictly for binary size
lto = "fat"        # Link-Time Optimization across dependencies
codegen-units = 1  # Maximize LTO effectiveness
panic = "abort"   # Strip stack unwinding logic
strip = true       # Strip debug symbols and tables
